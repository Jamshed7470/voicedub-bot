# Локальный Telegram Bot API сервер: снимает лимиты 20 МБ на скачивание
# и 50 МБ на отправку — с ним потолок 2000 МБ.
#
# Запуск:  docker compose up -d      (из этой папки)
# Логи:    docker compose logs -f
# Стоп:    docker compose down
services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: voicedub-bot-api
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      # --local: файлы отдаются путями на диске, без перекачки по HTTP
      TELEGRAM_LOCAL: 1
      TELEGRAM_MAX_WEBHOOK_CONNECTIONS: 100
      TELEGRAM_VERBOSITY: 1
    volumes:
      # том виден и контейнеру, и боту — пути из getFile должны совпадать
      - ./data:/var/lib/telegram-bot-api
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8081/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
