# ============ VoiceDub Bot — конфигурация пайплайна ============

profiles:
  full:
    whisper_model: large-v3
    nllb_model: facebook/nllb-200-distilled-1.3B
    demucs_model: htdemucs
  light:
    whisper_model: medium
    nllb_model: facebook/nllb-200-distilled-600M
    demucs_model: htdemucs

asr:
  batch_size: 8
  compute_type_gpu: auto        # auto: float16 при VRAM >= 7 ГБ (точнее), иначе int8_float16
  compute_type_cpu: int8
  vad_onset: 0.35               # ниже — VAD охотнее считает тихий звук речью
  vad_offset: 0.25
  no_speech_threshold: 0.45     # выше — реплики в шуме отбрасываются как «тишина»
  log_prob_threshold: -1.2      # ниже — реже выбрасываются «неуверенные» реплики
  recover_missed: true          # второй проход по местам, где голос есть, а текста нет
  recover_min_s: 0.8            # пропуски короче не дораспознаём
  recover_max_regions: 25       # предел участков на ролик (защита от долгой обработки)
  recover_min_logprob: -0.85    # строгая планка: выдуманная реплика хуже пропущенной
  language:                     # пусто — определять голосованием; код («tr», «en») — задать жёстко
  lang_probes: 12               # окон по 30 с по всей длине для голосования за язык
  lang_min_prob: 0.5            # окно с меньшей уверенностью в голосовании не участвует
  lang_min_rms: 0.005           # тише — считаем окно тишиной и пропускаем

limits:
  max_duration_minutes: 0       # 0 — без ограничения длительности (любое видео)
  telegram_download_mb: 20      # лимит Bot API на скачивание без локального сервера
  telegram_upload_mb: 50        # лимит Bot API на отправку файла ботом
  telegram_download_local_mb: 1900   # с локальным сервером (TELEGRAM_LOCAL_API_URL)
  telegram_upload_local_mb: 1900     # с локальным сервером: потолок Telegram — 2000 МБ
  # запас места на диске: сколько МБ на секунду исходника нужно пайплайну
  # (source+vocals+background+dubbed+analysis ≈ 0.77 МБ/с) плюс сами видеофайлы
  disk_mb_per_second: 0.9
  api_timeout_s: 1800           # таймаут запроса к Telegram (выгрузка 50 МБ не минутная)

download:
  max_height: 1080              # выше 1080p не качаем: длинный ролик занимает диск и время

audio:
  analysis_sr: 16000            # analysis.wav — для всех моделей анализа
  source_sr: 44100              # source.wav — для separations и копирования фрагментов
  tts_sr: 24000                 # выход XTTS-v2

separate:
  chunk_minutes: 10             # длиннее — Demucs идёт кусками (иначе всё в память)
  overlap_s: 4.0                # перекрытие кусков, склейка кроссфейдом

tts:
  cache_speaker_latents: true   # не пересчитывать отпечаток голоса на каждой реплике

segments:
  max_duration_s: 12.0          # длиннее — резать по самым большим паузам:
                                # реплика на двадцать секунд не влезает в слот,
                                # её нельзя переозвучить по частям и трудно
                                # проверить в студии
  min_duration_s: 1.0           # сегменты короче — склеивать с соседним того же спикера
  merge_gap_s: 0.3              # ...если пауза меньше этого значения

timing:
  atempo_max: 1.20              # рабочее ускорение: выше речь теряет разборчивость
  atempo_hard_max: 1.50         # крайний случай, когда реплика не влезает и после сокращения
  start_tolerance_ms: 50        # допуск на начало сегмента
  speed_soft_max: 1.15          # мягкая подгонка параметром speed в XTTS
  max_extend_s: 1.5             # насколько реплика может зайти в паузу после себя
  gap_guard_ms: 80              # зазор до начала следующей реплики

speaker_ref:
  min_ref_s: 3.0                # референс короче — использовать пресет-голос по полу
  target_ref_min_s: 15
  target_ref_max_s: 30

gender:
  model: alefiury/wav2vec2-large-xlsr-53-gender-recognition-librispeech
  min_segment_s: 1.5
  # пол — характеристика спикера, а не ролика: хватает выборки его реплик.
  # без этих границ час речи одного спикера уходит в pyin на десятки минут
  max_probe_segments: 40
  max_probe_s: 90
  f0_male_max_hz: 155
  f0_female_min_hz: 175
  f0_child_min_hz: 260          # медианный F0 выше — помечаем спикера как детский (подбор детского голоса из банка)
  clf_confidence_threshold: 0.8

emotions:
  model: speechbrain/emotion-recognition-wav2vec2-IEMOCAP

events:
  model: MIT/ast-finetuned-audioset-10-10-0.4593
  window_s: 2.0
  hop_s: 1.0
  threshold: 0.5
  crossfade_ms: 50
  min_event_s: 0.3
  batch_size: 16                # окон за один прогон модели (на часовом ролике их тысячи)
  # какие классы AudioSet копировать из оригинала
  classes:
    - Laughter
    - Giggle
    - Chuckle, chortle
    - Belly laugh
    - Crying, sobbing
    - Baby cry, infant cry
    - Sigh
    - Applause
    - Whistling
    - Screaming
  # сегмент речи, перекрытый событием более чем на эту долю, не синтезируется
  overlap_skip_ratio: 0.6

translation:
  claude_model: claude-sonnet-4-6
  xai_model: grok-4                # модель для «уличного» режима
  street_len_min: 0.9              # длина уличного перевода: 90–110% оригинала
  street_len_max: 1.1
  temperature: 0.2
  window_segments: 80
  overlap_segments: 5
  openrouter_model: minimax/minimax-m3:free   # выбрана замером: лучший смысл среди бесплатных
  openrouter_retries: 4         # бесплатный пул общий на всех — отказы бывают и они временные
  nllb_beams: 4                 # лучей у локального переводчика
  nllb_length_penalty: 0.9      # <1 — beam search склоняется к более коротким формулировкам
  nllb_pick_margin: 0.05        # из лучей в пределах этой дельты счёта берём самый короткий
  precompress: true                # укорачивать длинные реплики пачкой до синтеза
  precompress_ratio: 1.0        # во сколько раз реплика может превышать бюджет,
                                # прежде чем её сократят. Бюджет считается по
                                # РАБОЧЕМУ ускорению (atempo_max), а не по
                                # предельному: иначе нормой становится речь на
                                # грани разборчивости
  precompress_batch: 30            # реплик в одном запросе на сокращение
  # max_chars_ratio удалён: настройка была описана, но не читалась ни одной
  # строкой кода. Ограничение длины делает precompress_ratio ниже

# Темп речи (символов в секунду) для расчёта бюджета длины перевода.
# Используется как ЗАПАСНОЙ вариант: перед синтезом темп измеряется у
# самого голоса (voices/rate.py), потому что он зависит от голоса сильнее,
# чем от языка — замер на четырёх голосах банка дал разброс 9.2-13.9.
# Значение для ru исправлено с 14 на 12 по измерению (медиана 12.5).
speech_rate_chars_per_s:
  ru: 12
  en: 15
  tr: 13
  ar: 12
  zh-cn: 5
  ja: 7
  ko: 8
  hi: 13
  es: 15
  fr: 15
  de: 13
  it: 15
  pt: 15
  pl: 13
  nl: 14
  cs: 13
  hu: 13

mix:
  keep_background_default: true
  keep_original_track_default: false
  peak_dbfs: -1.0
  block_s: 30                   # микс идёт блоками: час стерео 44.1к в памяти не держим

output:
  dir: "готовые видео"          # папка с результатами (внутри проекта)
  video_codec_copy: true
  audio_bitrate: 192k
  compress_audio_kbps: 96       # звук при пережатии под лимит отправки
  compress_preset: slow         # проход теперь один — можно кодировать качественнее
  max_parts: 6                  # больше частей в чат не шлём — отдаём файл из папки
  # разрешение подбирается по доступному битрейту (см. QUALITY_LADDER в mux.py);
  # если ролик не влезает даже так — результат остаётся в папке готовых видео

jobs:
  keep_days: 7                  # хранить логи и speakers.json N дней

cache:
  max_gb: 10                    # общий размер кэша анализа источников
  keep_days: 14                 # хранить анализ ролика N дней с последнего использования
  max_source_minutes: 30        # короче — кэшируем всегда; длиннее — если позволяет диск
  keep_free_gb: 15              # столько места на диске остаётся свободным после кэша

diarization:
  max_speakers: 60              # верхняя граница в режиме «авто» (в банке 54 голоса; фильм даёт 20-30+ спикеров)
  clustering_threshold: null    # ниже 0.7 — охотнее разделяет похожие голоса (null: как у pyannote)

# ============ Studio v2: идентичность голоса и проверка человеком ============

studio:
  enabled: true                 # общий выключатель; в .env нужен ещё STUDIO_ENABLED=true
  host: 0.0.0.0
  port: 8080
  public_url: ""                # внешний адрес для ссылки в Telegram; пусто — localhost
  link_ttl_hours: 72            # сколько живёт подписанная ссылка на проект
  project_retention_days: 7     # столько дней задача открывается в студии для правок
  report_retention_days: 30     # project.json и отчёт живут дольше медиа
  embedded: true                # студия работает внутри процесса бота.
                                # false — запускать отдельно (python -m studio),
                                # но тогда за её жизнью следит человек: закрытое
                                # окно превращает ссылки из бота в «не удаётся
                                # получить доступ к сайту» без объяснений

speaker_identity:
  embedding_model: speechbrain/spkrec-ecapa-voxceleb
  min_segment_sec_for_embedding: 0.8   # короче — эмбеддинг по окну ±0.3 с и флаг
  merge_threshold: 0.55         # косинус центроидов, выше — кластеры это один человек
                                # откалибровано на фикстурах с известным ответом:
                                # при 0.55 все голоса разделяются без единой ошибки,
                                # при 0.45 уже склеиваются разные люди.
                                # Запас велик: свои реплики 0.65-0.71, чужие 0.13-0.20
  straggler_max_speech_sec: 4.0 # кластер короче — это обрывок, а не спикер:
                                # он присоединяется к ближайшему по голосу,
                                # иначе получит собственный профиль ради 3 секунд
  straggler_min_sim: 0.25       # мягкая планка для обрывков: секундная реплика
                                # даёт 0.35-0.43 даже к своему спикеру — это
                                # предел точности на таком фрагменте.
                                # Перенесённые реплики всегда помечаются
  overlap_merge_block_sec: 2.0  # столько одновременной речи запрещает слияние
  min_assign_sim: 0.55          # планка для реплик надёжной длины
  min_assign_sim_short: 0.33    # ...и для самых коротких: их отпечаток шумный
  reliable_segment_sec: 3.0     # с этой длины отпечатку можно верить полностью
  outlier_ratio: 0.75           # реплика считается выбросом, если похожа на свой
                                # кластер слабее этой доли его средней плотности:
                                # абсолютный порог не видит разницы между рыхлым
                                # и плотным кластером и помечает половину фильма
  reassign_margin: 0.08         # запас, нужный чтобы ПЕРЕНЕСТИ реплику к другому
  flag_margin: 0.05             # запас, ниже которого реплика ПОМЕЧАЕТСЯ на проверку.
                                # Отдельно от переноса: цена решений разная, и
                                # единый порог помечал половину фильма
  absolute_floor: 0.25          # реплика не похожа вообще ни на кого — пометить
  rounds: 2                     # итераций переприсваивания с пересчётом центроидов
  registry_match_threshold: 0.75  # сопоставление ID при повторной диаризации
  embedding_batch: 32           # сегментов за один прогон ECAPA
  isolated_max_sec: 1.5         # короткий одиночный сегмент внутри чужой серии
  isolated_margin: 0.05         # ...с margin ниже — не переворачивать, а пометить
  overlap_ratio: 0.3            # доля длины сегмента с двумя спикерами → overlap

voice_profile:
  target_ref_sec: 25            # столько чистой речи собираем в референс
  min_ref_sec_for_clone: 8      # меньше — клон запрещён, голос берётся из банка
  min_snr_db: 15                # кандидат тише этого в референс не идёт
  loudness_lufs: -23            # нормализация громкости референса
  min_candidate_sec: 1.5        # минимальная длина сегмента-кандидата
  min_candidate_conf: 0.8       # минимальная уверенность привязки к спикеру
  join_silence_sec: 0.2         # пауза между склеенными кусками референса

emotion:
  emotion_subprofiles: false    # эмоциональные под-профили выключены по умолчанию
  subprofile_min_sec: 6         # столько речи в эмоции нужно для под-профиля
  subprofile_identity_min: 0.85 # ...и такое сходство тембра с основным профилем

synthesis:
  temperature: 0.55
  max_chars_per_call: 220       # длиннее — режем по предложениям и склеиваем
  # Пороги сходства тембра. Замер: оригинальная речь против своего профиля
  # даёт 0.713, синтез на языке профиля 0.704, синтез на другом языке 0.470 —
  # XTTS переносит тембр между языками с заметной потерей. Единый порог
  # означал бы, что при дубляже с турецкого на русский не проходит ничего:
  # каждая реплика синтезируется трижды впустую, а настоящий уплывший голос
  # теряется среди ложных срабатываний.
  identity_qc_min_clone: 0.60         # клон, озвучка на языке оригинала
  identity_qc_min_clone_cross: 0.38   # клон, озвучка на другом языке
  identity_qc_min_preset: 0.65        # голос банка, тот же язык
  identity_qc_min_preset_cross: 0.42  # голос банка, другой язык
  duration_ratio_range: [0.5, 2.5]
  asr_backcheck: true           # обратное распознавание ловит «кашу» XTTS
  asr_backcheck_max_cer: 0.35
  asr_backcheck_model: small
  max_retries: 3                # попыток пересинтеза с новым seed
  chunk_join_sec: 0.12          # пауза при склейке частей длинной реплики
  stability_min_sec: 3.0        # стабильность считается по репликам от этой длины:
                                # на коротких отпечаток шумный, и метрика мерила бы
                                # длину реплик, а не устойчивость голоса
                                # (замер: 0.64 по всем против 0.78 по длинным)

casting:
  default_mode: auto            # clone | preset | auto
  unique_voices: true           # два спикера никогда не получают один пресет
  language_bonus: 0.05          # прибавка кандидату, знающему язык задачи
  candidates_top_n: 3           # столько вариантов показывается в «Кастинге»
