# ============ VoiceDub Bot — конфигурация пайплайна ============

profiles:
  full:
    whisper_model: large-v3
    nllb_model: facebook/nllb-200-distilled-1.3B
    demucs_model: htdemucs
  light:
    whisper_model: medium
    nllb_model: facebook/nllb-200-distilled-600M
    demucs_model: htdemucs

asr:
  batch_size: 8
  compute_type_gpu: auto        # auto: float16 при VRAM >= 7 ГБ (точнее), иначе int8_float16
  compute_type_cpu: int8
  vad_onset: 0.35               # ниже — VAD охотнее считает тихий звук речью
  vad_offset: 0.25
  no_speech_threshold: 0.45     # выше — реплики в шуме отбрасываются как «тишина»
  log_prob_threshold: -1.2      # ниже — реже выбрасываются «неуверенные» реплики
  recover_missed: true          # второй проход по местам, где голос есть, а текста нет
  recover_min_s: 0.8            # пропуски короче не дораспознаём
  recover_max_regions: 25       # предел участков на ролик (защита от долгой обработки)
  recover_min_logprob: -0.85    # строгая планка: выдуманная реплика хуже пропущенной

limits:
  max_duration_minutes: 0       # 0 — без ограничения длительности (любое видео)
  telegram_download_mb: 20      # лимит Bot API на скачивание без локального сервера
  telegram_upload_mb: 50        # лимит Bot API на отправку файла ботом
  telegram_download_local_mb: 1900   # с локальным сервером (TELEGRAM_LOCAL_API_URL)
  telegram_upload_local_mb: 1900     # с локальным сервером: потолок Telegram — 2000 МБ
  # запас места на диске: сколько МБ на секунду исходника нужно пайплайну
  # (source+vocals+background+dubbed+analysis ≈ 0.77 МБ/с) плюс сами видеофайлы
  disk_mb_per_second: 0.9
  api_timeout_s: 1800           # таймаут запроса к Telegram (выгрузка 50 МБ не минутная)

download:
  max_height: 1080              # выше 1080p не качаем: длинный ролик занимает диск и время

audio:
  analysis_sr: 16000            # analysis.wav — для всех моделей анализа
  source_sr: 44100              # source.wav — для separations и копирования фрагментов
  tts_sr: 24000                 # выход XTTS-v2

separate:
  chunk_minutes: 10             # длиннее — Demucs идёт кусками (иначе всё в память)
  overlap_s: 4.0                # перекрытие кусков, склейка кроссфейдом

tts:
  cache_speaker_latents: true   # не пересчитывать отпечаток голоса на каждой реплике

segments:
  min_duration_s: 1.0           # сегменты короче — склеивать с соседним того же спикера
  merge_gap_s: 0.3              # ...если пауза меньше этого значения

timing:
  atempo_max: 1.20              # рабочее ускорение: выше речь теряет разборчивость
  atempo_hard_max: 1.50         # крайний случай, когда реплика не влезает и после сокращения
  start_tolerance_ms: 50        # допуск на начало сегмента
  speed_soft_max: 1.15          # мягкая подгонка параметром speed в XTTS
  max_extend_s: 1.5             # насколько реплика может зайти в паузу после себя
  gap_guard_ms: 80              # зазор до начала следующей реплики

speaker_ref:
  min_ref_s: 3.0                # референс короче — использовать пресет-голос по полу
  target_ref_min_s: 15
  target_ref_max_s: 30

gender:
  model: alefiury/wav2vec2-large-xlsr-53-gender-recognition-librispeech
  min_segment_s: 1.5
  # пол — характеристика спикера, а не ролика: хватает выборки его реплик.
  # без этих границ час речи одного спикера уходит в pyin на десятки минут
  max_probe_segments: 40
  max_probe_s: 90
  f0_male_max_hz: 155
  f0_female_min_hz: 175
  f0_child_min_hz: 260          # медианный F0 выше — помечаем спикера как детский (подбор детского голоса из банка)
  clf_confidence_threshold: 0.8

emotions:
  model: speechbrain/emotion-recognition-wav2vec2-IEMOCAP

events:
  model: MIT/ast-finetuned-audioset-10-10-0.4593
  window_s: 2.0
  hop_s: 1.0
  threshold: 0.5
  crossfade_ms: 50
  min_event_s: 0.3
  batch_size: 16                # окон за один прогон модели (на часовом ролике их тысячи)
  # какие классы AudioSet копировать из оригинала
  classes:
    - Laughter
    - Giggle
    - Chuckle, chortle
    - Belly laugh
    - Crying, sobbing
    - Baby cry, infant cry
    - Sigh
    - Applause
    - Whistling
    - Screaming
  # сегмент речи, перекрытый событием более чем на эту долю, не синтезируется
  overlap_skip_ratio: 0.6

translation:
  claude_model: claude-sonnet-4-6
  xai_model: grok-4                # модель для «уличного» режима
  street_len_min: 0.9              # длина уличного перевода: 90–110% оригинала
  street_len_max: 1.1
  temperature: 0.2
  window_segments: 80
  overlap_segments: 5
  precompress: true                # укорачивать длинные реплики пачкой до синтеза
  precompress_ratio: 1.15          # запас: сокращаем только явно не влезающие
  precompress_batch: 30            # реплик в одном запросе на сокращение
  max_chars_ratio: 1.3          # перевод длиннее бюджета × ratio → запросить сжатый вариант

# темп речи (символов в секунду) для расчёта бюджета длины перевода
speech_rate_chars_per_s:
  ru: 14
  en: 15
  tr: 13
  ar: 12
  zh-cn: 5
  ja: 7
  ko: 8
  hi: 13
  es: 15
  fr: 15
  de: 13
  it: 15
  pt: 15
  pl: 13
  nl: 14
  cs: 13
  hu: 13

mix:
  keep_background_default: true
  keep_original_track_default: false
  peak_dbfs: -1.0
  block_s: 30                   # микс идёт блоками: час стерео 44.1к в памяти не держим

output:
  dir: "готовые видео"          # папка с результатами (внутри проекта)
  video_codec_copy: true
  audio_bitrate: 192k
  compress_audio_kbps: 96       # звук при пережатии под лимит отправки
  compress_preset: slow         # проход теперь один — можно кодировать качественнее
  max_parts: 6                  # больше частей в чат не шлём — отдаём файл из папки
  # разрешение подбирается по доступному битрейту (см. QUALITY_LADDER в mux.py);
  # если ролик не влезает даже так — результат остаётся в папке готовых видео

jobs:
  keep_days: 7                  # хранить логи и speakers.json N дней

cache:
  max_gb: 10                    # общий размер кэша анализа источников
  keep_days: 14                 # хранить анализ ролика N дней с последнего использования
  max_source_minutes: 30        # короче — кэшируем всегда; длиннее — если позволяет диск
  keep_free_gb: 15              # столько места на диске остаётся свободным после кэша

diarization:
  max_speakers: 60              # верхняя граница в режиме «авто» (в банке 54 голоса; фильм даёт 20-30+ спикеров)
  clustering_threshold: null    # ниже 0.7 — охотнее разделяет похожие голоса (null: как у pyannote)
